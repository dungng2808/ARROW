[run]
# "auto" writes runs/<UTC timestamp>. Resume always uses --resume together
# with the exact existing --output-dir; the stored execution contract supplies
# every immutable setting, while --workers may be overridden.
id = "auto"
workers = 5
max_revision_candidates = 500
build_timeout_seconds = 900
keep_workspaces = false
# Delete each repository mirror after its last selected class finishes.
# keep_workspaces=true also preserves mirrors, so retained worktrees remain usable.
keep_repo_cache = false

[input]
# The CLI resolves <root>/dataset automatically when it exists.
root = "R:/Đồ án/DatasetClassToTest/classes2test-main"

[java]
# Leave empty to use the host JDK. Add version-to-home mappings for historical projects.
default_home = ""
[java.homes]
# "8" = "C:/Java/jdk-8"
# "11" = "C:/Java/jdk-11"
# "17" = "C:/Java/jdk-17"
# "21" = "C:/Java/jdk-21"

[policy]
# A raw Classes2Test record cannot establish UPSTREAM_PINNED by itself.  Only a
# separate revision map may do so; otherwise matching source/test snippets is
# recorded as CONTENT_MATCHED and remains DISCOVERY_ONLY.
allow_content_matched_technical_manifest = true
integration_rule_file = ""
