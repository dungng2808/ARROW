[project]
name = "class2test-preflight"
version = "0.1.0"
description = "One-off, evidence-preserving preflight filter for Classes2Test Java CUTs"
requires-python = ">=3.11"
dependencies = [
  "tree-sitter>=0.24,<0.25",
  "tree-sitter-java>=0.23,<0.24",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "pytest-cov>=5,<7",
  "pytest-timeout>=2,<3",
  "hypothesis>=6,<7",
  "psutil>=5,<8",
  "jsonschema>=4,<5",
]
mutation = ["mutmut>=3,<4"]

[project.scripts]
class2test-preflight = "preflight.cli:main"

[tool.setuptools]
packages = ["preflight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "unit: deterministic unit test without Git or build tool",
  "business: business-policy decision-table test",
  "integration: local Git/worktree/process integration test",
  "toolchain: requires a real Maven, Gradle, or configured JDK",
  "e2e: local portfolio end-to-end test",
  "remote: non-gating test against a pinned public repository",
  "performance: benchmark/resource-bound test",
]
